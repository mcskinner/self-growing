[project]
name = "self-growing"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.121", "uvicorn>=0.38"]

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8", "httpx>=0.28"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
pythonpath = ["."]
